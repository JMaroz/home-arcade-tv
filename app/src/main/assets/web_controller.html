<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeArcade Web Controller</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080A10;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #111420;
            border-bottom: 1px solid #232838;
            font-size: 13px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: 12px;
            background: #1E2333;
            color: #94A3B8;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
        }
        .status-connected .status-dot {
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
        }
        .status-connected {
            color: #F8FAFC;
        }
        .slot-title {
            color: #EC4899;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
        }
        /* D-PAD STYLING */
        .dpad-container {
            width: 180px;
            height: 180px;
            position: relative;
        }
        .dpad-btn {
            position: absolute;
            background: #1A1F2E;
            border: 2px solid #2D3748;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #94A3B8;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #EC4899;
            color: #FFFFFF;
            border-color: #F472B6;
            box-shadow: 0 0 14px rgba(236, 72, 153, 0.6);
        }
        .dpad-up { top: 0; left: 60px; width: 60px; height: 60px; }
        .dpad-down { bottom: 0; left: 60px; width: 60px; height: 60px; }
        .dpad-left { top: 60px; left: 0; width: 60px; height: 60px; }
        .dpad-right { top: 60px; right: 0; width: 60px; height: 60px; }
        .dpad-center {
            position: absolute;
            top: 60px;
            left: 60px;
            width: 60px;
            height: 60px;
            background: #141824;
            border: 1px solid #232838;
        }

        /* CENTER SYSTEM BUTTONS */
        .system-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .sys-btn {
            background: #1A1F2E;
            border: 2px solid #3B4252;
            color: #FBBF24;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .sys-btn:active, .sys-btn.active {
            background: #F59E0B;
            color: #000;
            border-color: #FCD34D;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        }

        /* ARCADE ACTION BUTTONS */
        .arcade-buttons {
            width: 200px;
            height: 180px;
            position: relative;
        }
        .action-btn {
            position: absolute;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #FFFFFF;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }
        .btn-a {
            background: #EF4444;
            bottom: 10px;
            left: 10px;
            border-color: #F87171;
        }
        .btn-b {
            background: #3B82F6;
            bottom: 40px;
            left: 70px;
            border-color: #60A5FA;
        }
        .btn-c {
            background: #10B981;
            top: 20px;
            left: 80px;
            border-color: #34D399;
        }
        .btn-d {
            background: #F59E0B;
            top: 0px;
            right: 0px;
            border-color: #FBBF24;
        }
        .action-btn:active, .action-btn.active {
            transform: scale(0.92);
            filter: brightness(1.3);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <header>
        <span class="slot-title" id="slotTitle">HomeArcade P2</span>
        <div class="status-badge" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusText">Connessione...</span>
        </div>
    </header>

    <main>
        <!-- D-PAD -->
        <div class="dpad-container">
            <div class="dpad-btn dpad-up" data-bit="12">▲</div>
            <div class="dpad-btn dpad-left" data-bit="14">◀</div>
            <div class="dpad-center"></div>
            <div class="dpad-btn dpad-right" data-bit="15">▶</div>
            <div class="dpad-btn dpad-down" data-bit="13">▼</div>
        </div>

        <!-- COIN / START -->
        <div class="system-controls">
            <button class="sys-btn" data-bit="8">INSERT COIN</button>
            <button class="sys-btn" data-bit="9">START</button>
        </div>

        <!-- ACTION BUTTONS (NEO GEO / ARCADE 4-BUTTON) -->
        <div class="arcade-buttons">
            <div class="action-btn btn-a" data-bit="0">A</div>
            <div class="action-btn btn-b" data-bit="1">B</div>
            <div class="action-btn btn-c" data-bit="2">C</div>
            <div class="action-btn btn-d" data-bit="3">D</div>
        </div>
    </main>

    <script>
        var params = new URLSearchParams(window.location.search);
        var slotIndex = parseInt(params.get('slot') !== null ? params.get('slot') : '0', 10); // default P1 (slot 0)
        document.getElementById('slotTitle').innerText = 'HomeArcade P' + (slotIndex + 1);

        var buttonsMask = 0;
        var axisX = 0.0;
        var axisY = 0.0;
        var ws = null;

        function updateAxes() {
            var left = (buttonsMask & (1 << 14)) !== 0;
            var right = (buttonsMask & (1 << 15)) !== 0;
            var up = (buttonsMask & (1 << 12)) !== 0;
            var down = (buttonsMask & (1 << 13)) !== 0;

            axisX = (right ? 1.0 : 0.0) - (left ? 1.0 : 0.0);
            axisY = (down ? 1.0 : 0.0) - (up ? 1.0 : 0.0);
        }

        function sendState() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                var payload = JSON.stringify({
                    type: "input",
                    slot: slotIndex,
                    mask: buttonsMask,
                    ax: axisX,
                    ay: axisY
                });
                ws.send(payload);
            }
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(15);
            }
        }

        function connectWs() {
            var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var host = window.location.host;
            var url = proto + '//' + host + '/ws/gamepad?slot=' + slotIndex;

            var statusBadge = document.getElementById('statusBadge');
            var statusText = document.getElementById('statusText');

            ws = new WebSocket(url);

            ws.onopen = function() {
                statusBadge.className = 'status-badge status-connected';
                statusText.innerText = 'Pronto (P' + (slotIndex + 1) + ')';
            };

            ws.onclose = function() {
                statusBadge.className = 'status-badge';
                statusText.innerText = 'Disconnesso (Riconnessione...)';
                setTimeout(connectWs, 2000);
            };

            ws.onerror = function() {
                ws.close();
            };
        }

        function bindTouchEvents(el) {
            var bit = parseInt(el.getAttribute('data-bit'), 10);

            var startHandler = function(e) {
                e.preventDefault();
                buttonsMask |= (1 << bit);
                el.classList.add('active');
                triggerHaptic();
                updateAxes();
                sendState();
            };

            var endHandler = function(e) {
                e.preventDefault();
                buttonsMask &= ~(1 << bit);
                el.classList.remove('active');
                updateAxes();
                sendState();
            };

            el.addEventListener('touchstart', startHandler, { passive: false });
            el.addEventListener('touchend', endHandler, { passive: false });
            el.addEventListener('touchcancel', endHandler, { passive: false });
            el.addEventListener('mousedown', startHandler);
            el.addEventListener('mouseup', endHandler);
            el.addEventListener('mouseleave', endHandler);
        }

        document.querySelectorAll('[data-bit]').forEach(bindTouchEvents);
        connectWs();
    </script>
</body>
</html>
